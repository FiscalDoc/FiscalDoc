services:

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: veloxml-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=veloxml;Username=postgres;Password=${POSTGRES_PASSWORD}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=VeloXML
      - Jwt__Audience=VeloXML
      - Jwt__ExpiresInMinutes=60
      - Jwt__RefreshTokenExpiresInDays=7
      - Storage__Endpoint=minio:9000
      - Storage__AccessKey=${MINIO_ACCESS_KEY}
      - Storage__SecretKey=${MINIO_SECRET_KEY}
      - Storage__UseSSL=false
      - Redis__ConnectionString=redis:6379
      - Email__Host=mailpit
      - Email__Port=1025
      - Email__From=noreply@veloxml.com.br
      - Hangfire__DashboardUser=${HANGFIRE_DASHBOARD_USER}
      - Hangfire__DashboardPassword=${HANGFIRE_DASHBOARD_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - veloxml

  web:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: veloxml-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "4200:80"
    depends_on:
      - api
    networks:
      - veloxml

  postgres:
    image: postgres:16-alpine
    container_name: veloxml-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: veloxml
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - veloxml

  redis:
    image: redis:7-alpine
    container_name: veloxml-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - veloxml

  minio:
    image: minio/minio:latest
    container_name: veloxml-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - veloxml

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: veloxml-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - veloxml

  mailpit:
    image: axllent/mailpit:latest
    container_name: veloxml-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - veloxml

volumes:
  postgres_data:
  redis_data:
  minio_data:
  pgadmin_data:

networks:
  veloxml:
    driver: bridge
